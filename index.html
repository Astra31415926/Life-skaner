<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>taina · тест сканера v2</title>
<style>
:root{--ink:#0d0a08;--panel:#15100b;--acc:#c9a876;--acc-hot:#e8c890;--parch:#ede3d0;--muted:#94836a;--line:rgba(201,168,118,.22);--ok:#5ec98a;--err:#e07080}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--parch);font-family:'JetBrains Mono',ui-monospace,monospace;padding:24px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:20px;color:var(--acc-hot);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;transition:.2s;background:var(--panel)}
.drop:hover,.drop.over{border-color:var(--acc);background:rgba(201,168,118,.06)}
.drop input{display:none}
.drop-txt{color:var(--muted);font-size:14px}
.row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
.col{flex:1 1 300px}
canvas{max-width:100%;border:1px solid var(--line);border-radius:12px;background:#000;display:block}
.result{margin-top:16px;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-height:60px}
.result.ok{border-color:var(--ok)}
.result.err{border-color:var(--err)}
.res-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.res-text{font-size:22px;font-weight:700;word-break:break-word}
.res-text.ok{color:var(--ok)}
.res-text.err{color:var(--err)}
.diag{margin-top:16px;font-size:12px;color:var(--muted);white-space:pre-wrap;background:#0a0806;padding:12px;border-radius:10px;border:1px solid var(--line);max-height:300px;overflow-y:auto}
.diag b{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>taina · тест сканера · v4 (+ фото-режим Bradley)</h1>
  <p class="sub">Пісочниця для розробки. Завантаж орнамент — покаже, що відсканувалось і як.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*">
    <div class="drop-txt">📷 Клікни або перетягни орнамент сюди</div>
  </label>

  <div class="row">
    <div class="col">
      <div class="res-label">Завантажене</div>
      <canvas id="cv" width="512" height="512"></canvas>
    </div>
    <div class="col">
      <div class="result" id="result">
        <div class="res-label">Результат</div>
        <div class="res-text" id="restext">—</div>
      </div>
      <div class="diag" id="diag">Очікую зображення…</div>
    </div>
  </div>
</div>

<script>
const enc=new TextEncoder();
const decFatal=new TextDecoder('utf-8',{fatal:true});
const CH=['r','g','b'];
const RGB_SOFT={r:[220,50,60],g:[65,195,65],b:[60,70,215]};
const RGBTHR=125;

const MINN=7, MAXN=145;
function Rof(n){return (n-1)/2}
function capacity(m,n){const R=Rof(n);
  if(m==='oct')return (R+1)*(R+2)/2;
  if(m==='quad')return (R+1)*(R+1);
  if(m==='half')return (R+1)*n;
  return 0;}
function baseCells(m,n){const c=Rof(n),R=c,o=[];
  if(m==='oct'){for(let i=0;i<=R;i++)for(let j=0;j<=i;j++)o.push([c+i,c+j]);}
  else if(m==='quad'){for(let i=0;i<=R;i++)for(let j=0;j<=R;j++)o.push([c+i,c+j]);}
  else{for(let y=0;y<n;y++)for(let i=0;i<=R;i++)o.push([c+i,y]);}
  return o;}
function mirrors(m,n,x,y){const c=Rof(n),i=x-c,j=y-c;let p;
  if(m==='oct')p=[[i,j],[j,i],[-i,j],[-j,i],[i,-j],[j,-i],[-i,-j],[-j,-i]];
  else if(m==='quad')p=[[i,j],[-i,j],[i,-j],[-i,-j]];
  else p=[[i,j],[-i,j]];
  const o=[];
  for(const [a,b] of p){const X=c+a,Y=c+b;if(X>=0&&Y>=0&&X<n&&Y<n)o.push([X,Y])}
  return o;}
function pickN2(m,need){for(let n=MINN;n<=MAXN;n+=2)if(capacity(m,n)>=need)return n;return MAXN;}

function textBits(t){
  const data=enc.encode(t);
  const bits=new Uint8Array(data.length*8);
  for(let i=0;i<data.length;i++)for(let b=0;b<8;b++)bits[i*8+b]=(data[i]>>(7-b))&1;
  return {nby:data.length,bits};}
function isClean(t){for(const ch of t){const o=ch.codePointAt(0);
  if(o===0)return false;if(o<32&&ch!=='\n'&&ch!=='\t')return false;}return true;}
function bytesToText(by){
  while(by.length&&by[by.length-1]===0)by.pop();
  if(!by.length)return null;
  try{const t=decFatal.decode(new Uint8Array(by));return isClean(t)?t:null}catch(e){return null}}
/* offset: 0 чистий; 1 коли перша комірка — мітка (лише R монолита) */
function decodeSector(g,n,m,offset){
  const bc=baseCells(m,n),by=[];
  const start=offset||0;
  for(let i=start;i+7<bc.length;i+=8){
    let v=0;
    for(let b=0;b<8;b++){const [x,y]=bc[i+b];v=(v<<1)|(g[y*n+x]?1:0)}
    by.push(v);}
  return bytesToText(by);}
function markCell(g,n,m){const [x,y]=baseCells(m,n)[0];return g[y*n+x]?1:0;}

/* ── ВІДНОВЛЕННЯ ПО СИМЕТРІЇ (голосування по дзеркальних копіях) ──
   Кожен біт лежить у 8/4/2 клітинах (дзеркала). Пляма/блік вбиває частину копій —
   решта цілі, більшість вирішує. Три бар'єри проти хибного читання:
   1) minMargin — жоден біт не вирішено «на межі»;
   2) згода — текст пояснює ≥90% клітин поля;
   3) крос-звірка — голосування не суперечить одиночному читанню.
   Викликається ЛИШЕ коли точне читання (100% збіг) не вдалося. */
const VOTE_MARGIN=0.5, VOTE_AGREE=0.90;   // «сміливо»: чинить до ~26% поля
function decodeVoted(g,n,m,offset){
  const bc=baseCells(m,n),by=[],margins=[];const start=offset||0;
  for(let i=start;i+7<bc.length;i+=8){
    let v=0;
    for(let b=0;b<8;b++){const [x,y]=bc[i+b];
      const cells=mirrors(m,n,x,y);let ones=0;
      for(const [X,Y] of cells)ones+=g[Y*n+X]?1:0;
      const cnt=cells.length;let bit;
      if(ones*2>cnt)bit=1;else if(ones*2<cnt)bit=0;else bit=g[y*n+x]?1:0;
      margins.push(Math.abs(2*ones-cnt)/cnt);
      v=(v<<1)|bit;}
    by.push(v);}
  return {text:bytesToText(by),minMargin:margins.length?Math.min(...margins):0};}
/* повертає {text,err} якщо пройшло бар'єри, інакше null. markBit: null|0|1 */
function recoverVoted(g,n,m,offset,markBit){
  const v=decodeVoted(g,n,m,offset);
  if(v.text===null)return null;
  if(v.minMargin<VOTE_MARGIN)return null;
  const chk=fillChannel(v.text,n,m,markBit);
  let tot=0,match=0;
  for(let i=0;i<n*n;i++)if(chk.dm[i]){tot++;if((chk.g[i]?1:0)===g[i])match++;}
  if(!tot||match/tot<VOTE_AGREE)return null;
  const s=decodeSector(g,n,m,offset);            // крос-звірка
  if(s!==null&&s!==v.text)return null;
  return {text:v.text,agree:match/tot};}

function rowBuild(text,maxB){
  const chars=[...text],w=maxB*8,h=Math.max(chars.length,1);
  const g=new Uint8Array(w*h);
  chars.forEach((c,r)=>{const bs=enc.encode(c);
    for(let i=0;i<maxB;i++){const v=i<bs.length?bs[i]:0;
      for(let b=0;b<8;b++)g[r*w+i*8+b]=(v>>(7-b))&1;}});
  return {g,w,h};}
function rowDecode(g,w,h){
  if(w%8)return null;const maxB=w/8;if(maxB<1||maxB>4)return null;
  let out='';
  for(let r=0;r<h;r++){
    const bs=[];
    for(let i=0;i<maxB;i++){let v=0;for(let b=0;b<8;b++)v=(v<<1)|g[r*w+i*8+b];bs.push(v)}
    while(bs.length&&bs[bs.length-1]===0)bs.pop();
    if(!bs.length)continue;
    try{out+=decFatal.decode(new Uint8Array(bs))}catch(e){return null}}
  return (out&&isClean(out))?out:null;}

/* markBit: null=чисто; 0/1 = перша комірка мітка (лише для R монолита) */
function fillChannel(t,n,m,markBit){
  const g=new Uint8Array(n*n),dm=new Uint8Array(n*n);
  const bc=baseCells(m,n);
  let seq;
  if(markBit===null){const {bits}=textBits(t);seq=bits;}
  else{const {bits}=textBits(t);seq=new Uint8Array(bits.length+1);seq[0]=markBit;seq.set(bits,1);}
  const lim=Math.min(seq.length,bc.length);
  const ovf=seq.length>bc.length;
  for(let i=0;i<lim;i++){const [x,y]=bc[i];
    for(const [X,Y] of mirrors(m,n,x,y)){dm[Y*n+X]=1;if(seq[i])g[Y*n+X]=1}}
  return {g,dm,ovf};}

/* ═══════ ДЕКОДЕР КАРТИНКИ (поділом — запасний шлях) ═══════ */
function scanImage(px,IW,IH){
  const lum=p=>(px[p]+px[p+1]+px[p+2])/3;
  const measure=()=>{
    const runs=[];
    for(const f of [.15,.25,.35,.5,.65,.75,.85]){
      const y=Math.floor(IH*f);let prev=-1,len=0;
      for(let x=0;x<IW;x++){const cc=lum((y*IW+x)*4)>127?1:0;
        if(cc===prev)len++;else{if(prev>=0&&x>1&&x<IW-1)runs.push(len);prev=cc;len=1}}
      const x0=Math.floor(IW*f);prev=-1;len=0;
      for(let y2=0;y2<IH;y2++){const cc=lum((y2*IW+x0)*4)>127?1:0;
        if(cc===prev)len++;else{if(prev>=0&&y2>1&&y2<IH-1)runs.push(len);prev=cc;len=1}}}
    if(!runs.length)return [];
    const freq=new Map();
    for(const r of runs)if(r>0)freq.set(r,(freq.get(r)||0)+1);
    const sorted=[...freq.entries()].sort((a,b)=>b[1]-a[1]);
    const cands=new Set();
    for(let i=0;i<Math.min(4,sorted.length);i++)cands.add(sorted[i][0]);
    cands.add(Math.min(...runs));
    return [...cands].filter(m=>m>0);
  };
  const mmCands=measure();
  const readChan=(T,pad,n,ci)=>{const g=new Uint8Array(n*n),s=IW/T,sy=IH/T;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      const p=(Math.floor((y+pad+.5)*sy)*IW+Math.floor((x+pad+.5)*s))*4;
      const v=ci<0?lum(p):px[p+ci];
      g[y*n+x]=v>(ci<0?110:RGBTHR)?1:0;}
    return g;};
  const readRow=(TW,pad,w,h,ci)=>{const g=new Uint8Array(w*h),s=IW/TW;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const p=(Math.floor((y+pad+.5)*s)*IW+Math.floor((x+pad+.5)*s))*4;
      const v=ci<0?lum(p):px[p+ci];
      g[y*w+x]=v>110?1:0;}
    return g;};

  const Tset=new Set();
  for(const mm of mmCands){
    if(mm<2)continue;
    for(const k of [1,2,.5]){const ms=Math.round(mm*k);
      if(ms>0&&IW%ms===0){const T=IW/ms;if(T>=MINN&&T<=200)Tset.add(T)}}
    for(const k of [1,2,.5]){const cell=mm*k;
      if(cell>=2){const Tc=IW/cell;
        for(const Tr of [Math.round(Tc),Math.floor(Tc),Math.ceil(Tc)]){
          if(Tr>=MINN&&Tr<=200)Tset.add(Tr);}}}
  }

  const results=[];
  if(IW===IH)for(const T of Tset){
    for(const pad of [0,1,2]){
      const n=T-2*pad;
      if(n<MINN||n%2===0)continue;
      const cr=readChan(T,pad,n,0),cg=readChan(T,pad,n,1),cb=readChan(T,pad,n,2);
      const cl=readChan(T,pad,n,-1);
      let sameRGB=true;
      for(let z=0;z<cr.length;z++){if(cr[z]!==cg[z]||cr[z]!==cb[z]){sameRGB=false;break}}
      for(const m of ['oct','quad','half']){
        {const t=decodeSector(cl,n,m,0);
         if(t!==null){
           const chk=fillChannel(t,n,m,null);
           let same=true;for(let z=0;z<n*n&&same;z++)if((chk.g[z]?1:0)!==cl[z])same=false;
           if(same)results.push({kind:'one',mode:m,n,pad,res:[t,null,null]});}}
        if(!sameRGB){
          if(markCell(cr,n,m)===1){
            const rR=decodeSector(cr,n,m,1),rG=decodeSector(cg,n,m,0),rB=decodeSector(cb,n,m,0);
            if(rR!==null)results.push({kind:'mono',mode:m,n,pad,res:[(rR||'')+(rG||'')+(rB||''),null,null]});}
          const tr=decodeSector(cr,n,m,0),tg=decodeSector(cg,n,m,0),tb=decodeSector(cb,n,m,0);
          const cnt=[tr,tg,tb].filter(x=>x!==null).length;
          if(cnt>=2){
            const nonEmpty=[tr,tg,tb].filter(x=>x!==null);
            const allSame=nonEmpty.every(x=>x===nonEmpty[0]);
            if(!allSame)results.push({kind:'three',mode:m,n,pad,res:[tr,tg,tb]});}}}}}

  for(const pad of [0,1,2])for(const w of [8,16,24,32]){
    const TW=w+pad*2;if(IW%TW)continue;
    const cell=IW/TW;if(IH%cell)continue;
    if(mmCands.length&&!mmCands.some(mm=>Math.abs(cell-mm)<=1.5||Math.abs(cell-mm*2)<=1.5))continue;
    const TH=IH/cell,h=TH-pad*2;if(h<1||h>250)continue;
    const g=readRow(TW,pad,w,h,-1);
    const t=rowDecode(g,w,h);
    if(t===null)continue;
    let mb=1;for(const c of t){const k=enc.encode(c).length;if(k>mb)mb=k}
    if(mb*8!==w)continue;
    const r=rowBuild(t,mb);
    if(r.w!==w||r.h!==h)continue;
    let same=true;for(let i=0;i<w*h&&same;i++)if((r.g[i]?1:0)!==(g[i]?1:0))same=false;
    if(same)results.push({kind:'one',mode:'row',n:w,pad,res:[t,null,null]});}

  const seen=new Set(),uniq=[];
  for(const r of results){const key=r.kind+'|'+r.res.join('\u0001');
    if(!seen.has(key)){seen.add(key);uniq.push(r)}}
  uniq.sort((a,b)=>{
    const al=a.res.filter(x=>x).join('').length,bl=b.res.filter(x=>x).join('').length;
    if(al!==bl)return bl-al;
    const ax=a.kind==='three'?a.res.filter(x=>x).length:9;
    const bx=b.kind==='three'?b.res.filter(x=>x).length:9;
    if(a.kind==='three'&&b.kind==='three'&&ax!==bx)return bx-ax;
    return a.n-b.n;});
  if(uniq.length>1){
    const topLen=uniq[0].res.filter(x=>x).join('').length;
    if(topLen>=3){
      const filtered=uniq.filter(r=>r.res.filter(x=>x).join('').length>=3);
      if(filtered.length)return filtered;
    }
  }
  return uniq;}


// ══════════ ЧИТАННЯ ЛІНІЙКИ (точна сітка без гадання) ══════════
// Лінійка = зовнішнє кільце чорно-білих клітин однакової довжини.
// Кількість серій = число клітин T; довжина серії = розмір клітини.
// Працює за будь-якого масштабу, зокрема дробового кроку (1800/29=62.07).
function ruler_runs(get,len){
  let prev=-1,l=0,runs=[];
  for(let i=0;i<len;i++){const c=get(i)>127?1:0;
    if(c===prev)l++;else{if(prev>=0)runs.push(l);prev=c;l=1;}}
  runs.push(l);return runs;}
function ruler_median(a){const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)];}
function ruler_score(runs){
  if(runs.length<5)return null;
  const m=ruler_median(runs);if(m<3)return null;
  let reg=0;for(const r of runs)if(r>=m*0.55&&r<=m*1.45)reg++;
  return {m,frac:reg/runs.length,count:runs.length};}
// сканує смугу біля одного краю; повертає {T,cell} за модою регулярних рядків
function ruler_edge(lumFn,W,depth){
  const rows=[];
  for(let y=1;y<depth;y++){
    const s=ruler_score(ruler_runs(x=>lumFn(x,y),W));
    if(s&&s.frac>=0.85&&s.count>=7&&s.count<=200&&s.m>=4)rows.push(s);}
  if(rows.length<2)return null;
  const freq=new Map();for(const r of rows)freq.set(r.count,(freq.get(r.count)||0)+1);
  let T=null,fb=0;for(const [k,v] of freq)if(v>fb){fb=v;T=k;}
  const cell=ruler_median(rows.filter(r=>r.count===T).map(r=>r.m));
  return {T,cell,votes:fb};}
// читає лінійку по 4 краях квадратного зображення, крос-звіряє T
function findRuler(px,IW,IH){
  if(IW!==IH)return null;
  const lum=(x,y)=>{const p=(y*IW+x)*4;return (px[p]+px[p+1]+px[p+2])/3;};
  const depth=Math.max(20,Math.floor(IW*0.09));
  const edges=[
    ruler_edge((x,y)=>lum(x,y),IW,depth),          // верх
    ruler_edge((x,y)=>lum(x,IH-1-y),IW,depth),     // низ
    ruler_edge((x,y)=>lum(y,x),IW,depth),          // ліво
    ruler_edge((x,y)=>lum(IW-1-y,x),IW,depth),     // право
  ].filter(Boolean);
  if(!edges.length)return null;
  const freq=new Map();for(const e of edges)freq.set(e.T,(freq.get(e.T)||0)+e.votes);
  let T=null,fb=0;for(const [k,v] of freq)if(v>fb){fb=v;T=k;}
  const cell=ruler_median(edges.filter(e=>e.T===T).map(e=>e.cell));
  return {T,cell,edges:edges.length};}

// будує сітку СТРОГО по лінійці (крок = IW/T, дробовий) і декодує
function decodeByRuler(px,IW,IH,ruler){
  if(IW!==IH)return [];
  const lum=p=>(px[p]+px[p+1]+px[p+2])/3;
  const T=ruler.T, cell=IW/T;
  const results=[];
  const sampleChan=(n,pad,ci)=>{const g=new Uint8Array(n*n);
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      const X=Math.min(IW-1,Math.floor((x+pad+.5)*cell));
      const Y=Math.min(IH-1,Math.floor((y+pad+.5)*cell));
      const p=(Y*IW+X)*4;const v=ci<0?lum(p):px[p+ci];
      g[y*n+x]=v>(ci<0?110:RGBTHR)?1:0;}
    return g;};
  for(let pad=2;pad<=8;pad++){
    const n=T-2*pad; if(n<MINN||n%2===0)continue;
    const cl=sampleChan(n,pad,-1),cr=sampleChan(n,pad,0),cg=sampleChan(n,pad,1),cb=sampleChan(n,pad,2);
    let sameRGB=true;
    for(let z=0;z<cr.length;z++){if(cr[z]!==cg[z]||cr[z]!==cb[z]){sameRGB=false;break}}
    for(const m of ['oct','quad','half']){
      {const t=decodeSector(cl,n,m,0);
       if(t!==null){const chk=fillChannel(t,n,m,null);let same=true;
         for(let z=0;z<n*n&&same;z++)if((chk.g[z]?1:0)!==cl[z])same=false;
         if(same)results.push({kind:'one',mode:m,n,pad,res:[t,null,null]});}}
      if(!sameRGB){
        if(markCell(cr,n,m)===1){
          const rR=decodeSector(cr,n,m,1),rG=decodeSector(cg,n,m,0),rB=decodeSector(cb,n,m,0);
          if(rR!==null)results.push({kind:'mono',mode:m,n,pad,res:[(rR||'')+(rG||'')+(rB||''),null,null]});}
        const tr=decodeSector(cr,n,m,0),tg=decodeSector(cg,n,m,0),tb=decodeSector(cb,n,m,0);
        const cnt=[tr,tg,tb].filter(x=>x!==null).length;
        if(cnt>=2){const ne=[tr,tg,tb].filter(x=>x!==null);
          if(!ne.every(x=>x===ne[0]))results.push({kind:'three',mode:m,n,pad,res:[tr,tg,tb]});}}}}
  // ── запасний прохід: якщо точне читання нічого не дало — відновлення по симетрії ──
  if(!results.length){
    for(let pad=2;pad<=8;pad++){
      const n=T-2*pad; if(n<MINN||n%2===0)continue;
      const cl=sampleChan(n,pad,-1);
      for(const m of ['oct','quad','half']){
        const rv=recoverVoted(cl,n,m,0,null);
        if(rv)results.push({kind:'recovered',mode:m,n,pad,res:[rv.text,null,null],agree:rv.agree});}}
  }
  const seen=new Set(),uniq=[];
  for(const r of results){const key=r.kind+'|'+r.res.join('\u0001');
    if(!seen.has(key)){seen.add(key);uniq.push(r)}}
  uniq.sort((a,b)=>{const al=a.res.filter(x=>x).join('').length,bl=b.res.filter(x=>x).join('').length;
    return bl-al||a.n-b.n;});
  return uniq;}


// ── ШЛЯХ А: пошук орнаменту серед підпису/полів ──
function findOrnament(px,IW,IH){
  const lum=p=>(px[p]+px[p+1]+px[p+2])/3;
  const rowAct=new Array(IH).fill(0);
  const colAct=new Array(IW).fill(0);
  for(let y=0;y<IH;y++){
    let prev=-1,tr=0;
    for(let x=0;x<IW;x+=2){const cc=lum((y*IW+x)*4)>127?1:0;if(cc!==prev){tr++;prev=cc}}
    rowAct[y]=tr;
  }
  for(let x=0;x<IW;x++){
    let prev=-1,tr=0;
    for(let y=0;y<IH;y+=2){const cc=lum((y*IW+x)*4)>127?1:0;if(cc!==prev){tr++;prev=cc}}
    colAct[x]=tr;
  }
  const maxRow=Math.max(...rowAct),maxCol=Math.max(...colAct);
  const rowThr=Math.max(4,maxRow*0.25),colThr=Math.max(4,maxCol*0.25);
  function longestBlock(act,thr){
    let bestS=0,bestE=-1,curS=-1,gap=0;const maxGap=Math.max(8,act.length*0.03);
    for(let i=0;i<act.length;i++){
      if(act[i]>=thr){
        if(curS<0)curS=i;gap=0;
        if(i-curS>bestE-bestS){bestS=curS;bestE=i;}
      }else{
        if(curS>=0){gap++;if(gap>maxGap){curS=-1;gap=0;}}
      }
    }
    return [bestS,bestE];
  }
  let [y0,y1]=longestBlock(rowAct,rowThr);
  let [x0,x1]=longestBlock(colAct,colThr);
  if(y1<=y0||x1<=x0)return null;
  const cw=x1-x0,ch=y1-y0;
  const side=Math.max(cw,ch);
  let cx=(x0+x1)/2,cy=(y0+y1)/2;
  let nx0=Math.round(cx-side/2),ny0=Math.round(cy-side/2);
  let nx1=nx0+side,ny1=ny0+side;
  nx0=Math.max(0,nx0);ny0=Math.max(0,ny0);nx1=Math.min(IW,nx1);ny1=Math.min(IH,ny1);
  const cropW=nx1-nx0,cropH=ny1-ny0;
  if(cropW<20||cropH<20)return null;
  return {x0:nx0,y0:ny0,w:cropW,h:cropH};
}
function cropPx(px,IW,IH,box){
  const {x0,y0,w,h}=box;
  const out=new Uint8ClampedArray(w*h*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const src=((y0+y)*IW+(x0+x))*4,dst=(y*w+x)*4;
    out[dst]=px[src];out[dst+1]=px[src+1];out[dst+2]=px[src+2];out[dst+3]=255;
  }
  return out;
}

// ── ШЛЯХ Б: випрямлення за 4 кутами (проєктивно — тримає і нахил, і перспективу) ──
function findCorners(px,IW,IH){
  const corners4=[[0,0],[IW-1,0],[0,IH-1],[IW-1,IH-1]];
  const bgSamples=corners4.map(([x,y])=>{const p=(y*IW+x)*4;return [px[p],px[p+1],px[p+2]];});
  const bg=[0,1,2].map(c=>Math.round(bgSamples.reduce((s,v)=>s+v[c],0)/bgSamples.length));
  const isPat=(x,y)=>{
    const p=(y*IW+x)*4;
    const dr=px[p]-bg[0],dg=px[p+1]-bg[1],db=px[p+2]-bg[2];
    return Math.sqrt(dr*dr+dg*dg+db*db)>60;
  };
  let top=null,bot=null,left=null,right=null;
  const step=Math.max(1,Math.floor(IW/500));
  for(let y=0;y<IH;y+=step)for(let x=0;x<IW;x+=step){
    if(!isPat(x,y))continue;
    if(!top||y<top[1])top=[x,y];
    if(!bot||y>bot[1])bot=[x,y];
    if(!left||x<left[0])left=[x,y];
    if(!right||x>right[0])right=[x,y];
  }
  if(!top||!bot||!left||!right)return null;
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const s=[d(top,right),d(right,bot),d(bot,left),d(left,top)];
  const avg=(s[0]+s[1]+s[2]+s[3])/4;
  if(avg<30)return null;
  const spread=Math.max(...s)-Math.min(...s);
  if(spread/avg>0.35)return null;
  return {TL:top,TR:right,BR:bot,BL:left,side:avg};
}
// проєктивна гомографія: одиничний квадрат → чотирикутник (TL,TR,BR,BL)
function deskew(px,IW,IH,corners,N){
  const {TL,TR,BR,BL}=corners;
  const x0=TL[0],y0=TL[1],x1=TR[0],y1=TR[1],x2=BR[0],y2=BR[1],x3=BL[0],y3=BL[1];
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3;
  const dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  let a,b,c,d,e,f,g,h;
  if(Math.abs(dx3)<1e-9&&Math.abs(dy3)<1e-9){
    a=x1-x0;b=x3-x0;c=x0;d=y1-y0;e=y3-y0;f=y0;g=0;h=0;
  }else{
    const den=dx1*dy2-dx2*dy1;
    g=(dx3*dy2-dx2*dy3)/den;h=(dx1*dy3-dx3*dy1)/den;
    a=x1-x0+g*x1;b=x3-x0+h*x3;c=x0;d=y1-y0+g*y1;e=y3-y0+h*y3;f=y0;
  }
  const samp=(x,y,ch)=>{
    const xi=Math.max(0,Math.min(IW-1,Math.floor(x))),yi=Math.max(0,Math.min(IH-1,Math.floor(y)));
    const xf=Math.max(0,Math.min(1,x-xi)),yf=Math.max(0,Math.min(1,y-yi));
    const x1_=Math.min(IW-1,xi+1),y1_=Math.min(IH-1,yi+1);
    const A=px[(yi*IW+xi)*4+ch],B=px[(yi*IW+x1_)*4+ch],D=px[(y1_*IW+xi)*4+ch],E=px[(y1_*IW+x1_)*4+ch];
    return A*(1-xf)*(1-yf)+B*xf*(1-yf)+D*(1-xf)*yf+E*xf*yf;
  };
  const out=new Uint8ClampedArray(N*N*4);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const u=i/(N-1),v=j/(N-1);const den=g*u+h*v+1;
    const x=(a*u+b*v+c)/den,y=(d*u+e*v+f)/den;const dst=(j*N+i)*4;
    out[dst]=samp(x,y,0);out[dst+1]=samp(x,y,1);out[dst+2]=samp(x,y,2);out[dst+3]=255;
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════════
   ФОТО-ШЛЯХ v4: локальний поріг Брэдлі (нерівне світло, блік, муар екрана)
   + рамка-лінійка по регулярності. Читає з фото/паперу коротко-середні коди.
   Використовує наявні: findOrnament, findRuler, decodeByRuler.
   Безпечно: рішення ухвалює той самий decodeByRuler (точно + суворе голосування),
   тож хибних читань не додає; складне чесно лишає непрочитаним.
   ═══════════════════════════════════════════════════════════════════ */
function bradley(px,IW,IH,winFrac,tPct){
  const lum=i=>(px[i*4]+px[i*4+1]+px[i*4+2])/3;
  const integ=new Float64Array(IW*IH);
  for(let y=0;y<IH;y++){let s=0;for(let x=0;x<IW;x++){s+=lum(y*IW+x);
    integ[y*IW+x]=(y>0?integ[(y-1)*IW+x]:0)+s;}}
  const S=Math.max(2,Math.floor(IW*winFrac)),t=tPct;
  const out=new Uint8ClampedArray(IW*IH*4);
  for(let y=0;y<IH;y++)for(let x=0;x<IW;x++){
    const x1=Math.max(x-S,0),x2=Math.min(x+S,IW-1),y1=Math.max(y-S,0),y2=Math.min(y+S,IH-1);
    const count=(x2-x1)*(y2-y1);
    const sum=integ[y2*IW+x2]-integ[y1*IW+x2]-integ[y2*IW+x1]+integ[y1*IW+x1];
    const v=lum(y*IW+x);
    const res=(v*count<=sum*(100-t)/100)?0:255;   // світліше локального серед. → 255 (дані)
    const d=(y*IW+x)*4;out[d]=out[d+1]=out[d+2]=res;out[d+3]=255;}
  return out;}
function pbox_runs(get,len){let p=-1,r=[],s=0;for(let i=0;i<len;i++){const c=get(i)>127?1:0;
  if(c!==p){if(p>=0)r.push([s,i-1]);s=i;p=c;}}r.push([s,len-1]);return r;}
function pbox_med(a){const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)];}
function pbox_reg(rs){if(rs.length<7)return 0;const L=rs.map(s=>s[1]-s[0]+1);const m=pbox_med(L);
  if(m<3)return 0;let g=0;for(const l of L)if(l>=m*.55&&l<=m*1.45)g++;return g/rs.length;}
function pbox_rulerBox(px,W,H){const lum=(x,y)=>px[(y*W+x)*4];
  const T=()=>{for(let y=Math.floor(H*.004);y<Math.floor(H*.25);y++)if(pbox_reg(pbox_runs(k=>lum(k,y),W))>=.75)return y;return -1;};
  const B=()=>{for(let y=H-1-Math.floor(H*.004);y>Math.floor(H*.75);y--)if(pbox_reg(pbox_runs(k=>lum(k,y),W))>=.75)return y;return -1;};
  const L=()=>{for(let x=Math.floor(W*.004);x<Math.floor(W*.25);x++)if(pbox_reg(pbox_runs(k=>lum(x,k),H))>=.75)return x;return -1;};
  const R=()=>{for(let x=W-1-Math.floor(W*.004);x>Math.floor(W*.75);x--)if(pbox_reg(pbox_runs(k=>lum(x,k),H))>=.75)return x;return -1;};
  const t=T(),b=B(),l=L(),r=R();if([t,b,l,r].some(v=>v<0))return null;return {x0:l,y0:t,w:r-l+1,h:b-t+1};}
function pbox_toSquare(px,W,H){const N=Math.max(W,H);const o=new Uint8ClampedArray(N*N*4);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const sx=Math.min(W-1,Math.floor(x*W/N)),sy=Math.min(H-1,Math.floor(y*H/N));
    const s=(sy*W+sx)*4,d=(y*N+x)*4;o[d]=px[s];o[d+1]=px[s+1];o[d+2]=px[s+2];o[d+3]=255;}return {px:o,N};}
function scanPhoto(px,IW,IH){
  const box=findOrnament(px,IW,IH);if(!box)return [];
  const cpx=cropPx(px,IW,IH,box);let out=[];
  for(const wt of [[1/12,12],[1/16,10],[1/8,15]]){
    const b=bradley(cpx,box.w,box.h,wt[0],wt[1]);
    const rb=pbox_rulerBox(b,box.w,box.h);if(!rb)continue;
    if(rb.w/rb.h<0.85||rb.w/rb.h>1.18)continue;
    const bc=cropPx(b,box.w,box.h,rb);
    const sq=pbox_toSquare(bc,rb.w,rb.h);
    const ru=findRuler(sq.px,sq.N,sq.N);if(!ru)continue;
    const rr=decodeByRuler(sq.px,sq.N,sq.N,ru);if(rr.length)out=out.concat(rr);}
  return out;}

// ── UI ──
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const drop=$('drop'),file=$('file');

function log(msg){$('diag').innerHTML=msg;}

// аналітичний буфер: квадрат до 1500px, фон = колір кутового пікселя джерела
function buildBuffer(img){
  const AS=Math.max(512,Math.min(1500,Math.max(img.width,img.height)));
  const cc=document.createElement('canvas');cc.width=AS;cc.height=AS;
  const g=cc.getContext('2d',{willReadFrequently:true});
  const tmp=document.createElement('canvas');tmp.width=img.width;tmp.height=img.height;
  const tg=tmp.getContext('2d',{willReadFrequently:true});tg.drawImage(img,0,0);
  const cp=tg.getImageData(0,0,1,1).data;
  g.fillStyle='rgb('+cp[0]+','+cp[1]+','+cp[2]+')';g.fillRect(0,0,AS,AS);
  const scale=Math.min(AS/img.width,AS/img.height);
  const w=img.width*scale,h=img.height*scale;
  g.imageSmoothingEnabled=true;
  g.drawImage(img,(AS-w)/2,(AS-h)/2,w,h);
  return {px:g.getImageData(0,0,AS,AS).data,IW:AS,IH:AS};
}

// на одному джерелі пробуємо і лінійку (пріоритет), і поділ (запас)
function collect(px,IW,IH,pathName,box,corners,attempts){
  try{const ruler=findRuler(px,IW,IH);
    if(ruler){const rr=decodeByRuler(px,IW,IH,ruler);
      if(rr.length)attempts.push({f:rr,path:pathName+' + лінійка',box,corners,ruler});}}catch(e){}
  try{const f=scanImage(px,IW,IH);
    if(f.length)attempts.push({f,path:pathName+' + поділ',box,corners,ruler:null});}catch(e){}
}

function processImage(img){
  const t0=performance.now();
  const buf=buildBuffer(img);const IW=buf.IW,IH=buf.IH,px=buf.px;
  // прев'ю
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  const sc=Math.min(cv.width/img.width,cv.height/img.height);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img,(cv.width-img.width*sc)/2,(cv.height-img.height*sc)/2,img.width*sc,img.height*sc);

  const attempts=[];
  // 1) пряме
  collect(px,IW,IH,'пряме',null,null,attempts);
  // 2) шлях А — обрізка орнаменту
  const box=findOrnament(px,IW,IH);
  if(box){const cpx=cropPx(px,IW,IH,box);
    collect(cpx,box.w,box.h,'шлях А (обрізка)',box,null,attempts);}
  // 3) шлях Б — випрямлення за 4 кутами
  const corners=findCorners(px,IW,IH);
  if(corners){const N=Math.max(512,Math.min(1400,Math.round(corners.side)));
    const dpx=deskew(px,IW,IH,corners,N);
    collect(dpx,N,N,'шлях Б (випрямлення)',null,corners,attempts);}
  // 4) фото-режим (Bradley) — екран/папір, блік, нерівне світло
  try{const pf=scanPhoto(px,IW,IH);
    if(pf.length)attempts.push({f:pf,path:'фото-режим (Bradley)',box:null,corners:null,ruler:{T:pf[0].n}});}catch(e){}

  // найкращий: найдовший валідний текст; за рівності — з лінійкою (точніший)
  attempts.sort((a,b)=>{
    const al=a.f[0].res.filter(x=>x).join('').length,bl=b.f[0].res.filter(x=>x).join('').length;
    if(al!==bl)return bl-al;
    return (a.ruler?0:1)-(b.ruler?0:1);
  });

  const dt=(performance.now()-t0).toFixed(0);
  const rbox=$('result'),rtext=$('restext');
  if(attempts.length){
    const best=attempts[0];const found=best.f;const top=found[0];
    const txt=top.res.filter(x=>x).join(' | ');
    rtext.textContent=txt;rtext.className='res-text ok';rbox.className='result ok';
    let dg='<b>✓ ВІДСКАНОВАНО</b> за '+dt+' мс\n';
    dg+='спосіб: '+best.path+'\n';
    if(best.ruler)dg+='лінійка: '+best.ruler.T+' клітин · крок '+best.ruler.cell.toFixed(1)+'px · поле '+top.n+'×'+top.n+' ('+best.ruler.edges+' краї)\n';
    if(best.box)dg+='обрізка: ('+best.box.x0+','+best.box.y0+') '+best.box.w+'×'+best.box.h+'\n';
    if(best.corners)dg+='випрямлено, стор.≈'+Math.round(best.corners.side)+'px\n';
    dg+='буфер: '+img.width+'×'+img.height+' → '+IW+'×'+IH+'\n';
    dg+='режим: '+top.mode+' pad='+top.pad+' ('+top.kind+')\n';
    dg+='варіантів: '+found.length+'\n\n';
    found.slice(0,5).forEach((fr,i)=>{
      dg+=(i+1)+'. "'+fr.res.filter(x=>x).join(' | ')+'"  [n='+fr.n+' '+fr.mode+' pad='+fr.pad+' '+fr.kind+']\n';
    });
    log(dg);
  }else{
    rtext.textContent='не відсканувалось';rtext.className='res-text err';rbox.className='result err';
    log('<b>✗ НЕ ВІДСКАНУВАЛОСЬ</b> за '+dt+' мс\nбуфер: '+img.width+'×'+img.height+' → '+IW+'×'+IH+'\n\nДекодер не знайшов валідної сітки.');
  }
}

function loadFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{processImage(img);URL.revokeObjectURL(url);};
  img.src=url;
}

file.onchange=e=>loadFile(e.target.files[0]);
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');loadFile(e.dataTransfer.files[0]);});
</script>
